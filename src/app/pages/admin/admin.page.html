<header class="page-head">
  <span class="kicker">EQUIPMENT DESK</span>
  <h1>Admin sign-in</h1>
  <p>Unlock the tools for adding, editing, and deleting equipment.</p>
</header>
<section class="card panel admin-panel">
  <span class="tile"><ion-icon name="shield-checkmark-outline"></ion-icon></span>
  @if (admin.unlocked()) {
    <h2>Admin tools unlocked</h2>
    <a class="button primary" routerLink="/inventory">Go to Inventory</a>
  } @else {
    <h2>Enter your admin PIN</h2>
    <form class="form" (ngSubmit)="login()" novalidate>
      <label>4-digit PIN
        <input class="pin" type="password" inputmode="numeric" autocomplete="off" name="pin"
          maxlength="4" pattern="[0-9]{4}" [(ngModel)]="pin" required>
      </label>
      @if (error) { <p class="notice error" role="alert">{{ error }}</p> }
      <button type="submit" class="button primary">Unlock admin tools</button>
    </form>
  }
</section>
